<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play — Pickle Castle Game Studios</title>
<link rel="icon" href="assets/brand/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/vendor/game-forge/buttons.css">
<link rel="stylesheet" href="assets/vendor/game-forge/themes.css">
<style>
  /* bug-report.js/modal.js ship no CSS of their own by design ("bring your
     own") — this is that CSS, mapped onto the site's own brand tokens from
     style.css so the report form matches the rest of the page exactly. */
  .modal-overlay{
    position:fixed;inset:0;z-index:10000;background:rgba(38,41,38,.55);
    display:flex;align-items:center;justify-content:center;padding:16px;
    overflow-y:auto;
  }
  .modal-box{
    background:var(--cream);border:var(--border) solid var(--ink);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);
    width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow-y:auto;
    padding:20px;font-family:var(--font-body);color:var(--ink);
  }
  .modal-box h3{font-family:var(--font-display);margin:0 0 4px;font-size:1.25rem;}
  .rpt-sub{margin:0 0 14px;font-size:.88rem;color:var(--ink-soft);}
  .rpt-fld-label{display:block;font-family:var(--font-display);font-size:.82rem;margin:12px 0 4px;}
  .rpt-fld{
    width:100%;box-sizing:border-box;font-family:var(--font-body);font-size:.95rem;
    padding:9px 10px;border:2px solid var(--ink);border-radius:10px;
    background:var(--white);color:var(--ink);resize:vertical;
  }
  textarea.rpt-fld{min-height:80px;}
  .rpt-fld:focus{outline:3px solid var(--orange);outline-offset:1px;}
  .rpt-out{min-height:150px;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;}
</style>
</head>
<body class="play-shell" data-theme="pickle-castle">
  <div class="wrap play-bar">
    <a class="pc-btn pc-btn--ghost pc-btn--sm" href="index.html#games">← All games</a>
    <h1 id="play-title">Loading…</h1>
    <a class="pc-btn pc-btn--ghost pc-btn--sm" id="guide-link" href="#" hidden>📋 Playtester guide</a>
    <button type="button" class="pc-btn pc-btn--ghost pc-btn--sm" id="fs-toggle" aria-pressed="false" hidden>⛶ Fullscreen</button>
    <a class="pc-btn pc-btn--primary pc-btn--sm" href="#" data-link="kofi">Support us</a>
  </div>
  <div class="play-frame-wrap" id="play-mount"></div>

  <div class="wrap play-support" id="play-support" hidden>
    <p class="play-support-note" id="play-support-note"></p>
    <a class="pc-btn pc-btn--primary" href="#" data-link="kofi">☕ Support on Ko-Fi</a>
  </div>

<script src="assets/js/content.js"></script>
<script src="assets/js/play.js"></script>
<script type="module" src="assets/js/play-bugreport.js"></script>
</body>
</html>
