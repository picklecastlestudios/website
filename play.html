<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play — Pickle Castle Game Studios</title>
<link rel="icon" href="assets/brand/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* Bug report / feedback widget — floating button, shown over every played
     game since this page is the one shared mount point for all of them. */
  .pc-fab{
    position:fixed;bottom:16px;right:16px;z-index:9999;width:52px;height:52px;
    border-radius:50%;background:#FDF2E2;border:3px solid #F96318;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);
    transition:.15s ease;
  }
  .pc-fab:hover{transform:scale(1.06);}
  .pc-fab:focus-visible{outline:3px solid #F96318;outline-offset:3px;}
  .pc-fab svg{width:28px;height:28px;}
  .pc-fab-menu{
    position:fixed;bottom:76px;right:16px;z-index:9999;display:flex;
    flex-direction:column;gap:8px;align-items:flex-end;
  }
  .pc-fab-item{
    display:flex;align-items:center;gap:8px;background:#2D5D2E;color:#FDF2E2;
    border:none;border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer;
    font-family:'Fredoka',system-ui,sans-serif;font-size:.85rem;
    opacity:0;transform:translateY(6px) scale(.95);transition:.15s ease;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
  }
  .pc-fab-item:hover{background:#F96318;}
  .pc-fab-item:focus-visible{outline:3px solid #F96318;outline-offset:2px;}
  .pc-fab-menu.open .pc-fab-item{opacity:1;transform:translateY(0) scale(1);}
  .pc-fab-item img{width:22px;height:22px;object-fit:contain;flex:none;}

  /* Bug/feedback form modal — collects real detail instead of firing a bare
     mailto with no body, and always offers a copy-to-clipboard fallback
     since mailto silently no-ops on a desktop with no mail client set up. */
  .pc-overlay{
    position:fixed;inset:0;z-index:10000;background:rgba(38,41,38,.55);
    display:flex;align-items:center;justify-content:center;padding:16px;
    overflow-y:auto;
  }
  .pc-modal{
    background:var(--cream,#FDF2E2);border:var(--border,3px) solid var(--ink,#262926);
    border-radius:var(--radius-lg,26px);box-shadow:var(--shadow,6px 6px 0 #262926);
    width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow-y:auto;
    padding:20px;margin:auto;font-family:var(--font-body,'Nunito',sans-serif);color:var(--ink,#262926);
  }
  .pc-modal h3{
    font-family:var(--font-display,'Fredoka',sans-serif);margin:0 0 4px;font-size:1.25rem;
    display:flex;align-items:center;gap:8px;
  }
  .pc-modal h3 img{width:24px;height:24px;flex:none;}
  .pc-sub{margin:0 0 14px;font-size:.88rem;color:var(--ink-soft,#4B524B);}
  .pc-fld-label{display:block;font-family:var(--font-display,'Fredoka',sans-serif);font-size:.82rem;margin:12px 0 4px;}
  .pc-fld{
    width:100%;box-sizing:border-box;font-family:var(--font-body,'Nunito',sans-serif);font-size:.95rem;
    padding:9px 10px;border:2px solid var(--ink,#262926);border-radius:10px;background:var(--white,#FFFDF8);
    color:var(--ink,#262926);resize:vertical;
  }
  textarea.pc-fld{min-height:80px;}
  .pc-fld:focus{outline:3px solid var(--orange,#F96318);outline-offset:1px;}
  .pc-report-out{min-height:150px;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;}
  .pc-btn{
    display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:10px 14px;
    border:var(--border,3px) solid var(--ink,#262926);border-radius:999px;cursor:pointer;
    font-family:var(--font-display,'Fredoka',sans-serif);font-weight:600;font-size:.95rem;
    box-shadow:3px 3px 0 var(--ink,#262926);transition:.1s ease;background:var(--white,#FFFDF8);color:var(--ink,#262926);
  }
  .pc-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink,#262926);}
  .pc-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink,#262926);}
  .pc-btn:focus-visible{outline:3px solid var(--orange,#F96318);outline-offset:2px;}
  .pc-btn-primary{background:var(--orange,#F96318);}
  .pc-btn-secondary{background:var(--green,#2D5D2E);color:var(--cream,#FDF2E2);}

  @media (prefers-reduced-motion:reduce){
    .pc-fab,.pc-fab-item,.pc-btn{transition:none;}
  }
</style>
</head>
<body class="play-shell">
  <div class="wrap play-bar">
    <a class="btn btn-ghost btn-sm" href="index.html#games">← All games</a>
    <h1 id="play-title">Loading…</h1>
    <a class="btn btn-kofi btn-sm" href="#" data-link="kofi">Support us</a>
  </div>
  <div class="play-frame-wrap" id="play-mount"></div>

  <div class="wrap play-support" id="play-support" hidden>
    <p class="play-support-note" id="play-support-note"></p>
    <a class="btn btn-kofi" href="#" data-link="kofi">☕ Support on Ko-Fi</a>
  </div>

<script src="assets/js/content.js"></script>
<script>
(function () {
  "use strict";
  document.querySelectorAll("[data-link]").forEach(function (el) {
    var url = SITE.links[el.getAttribute("data-link")];
    if (url && !/CHANGE-ME/.test(url)) {
      el.href = url; el.target = "_blank"; el.rel = "noopener";
    }
  });

  var slug = new URLSearchParams(location.search).get("game");
  // Prototypes share this same play page — check games first, then
  // prototypes, so a slug never has to be unique across both lists but
  // an accidental collision still favors the finished game.
  var game = (SITE.games || []).concat(SITE.prototypes || [])
    .filter(function (g) { return g.slug === slug; })[0];
  var mount = document.getElementById("play-mount");

  if (!game) {
    document.getElementById("play-title").textContent = "Game not found";
    mount.innerHTML = '<p class="play-error">That game isn\'t in the castle. ' +
      '<a href="index.html#games" style="color:#F96318">Back to the arcade →</a></p>';
    return;
  }

  document.title = game.title + " — Pickle Castle Game Studios";
  document.getElementById("play-title").textContent = game.title;

  if (game.embed.type === "external") {
    // Nothing to embed for a native app / storefront listing — this page
    // shouldn't normally be reached for one (the homepage links out
    // directly instead), but handle it gracefully if it is.
    mount.innerHTML = game.embed.url
      ? '<p class="play-error">This game opens in its own store. ' +
        '<a href="' + game.embed.url.replace(/"/g, "&quot;") + '" style="color:#F96318">Get it →</a></p>'
      : '<p class="play-error">Not out yet — check back soon. ' +
        '<a href="index.html#games" style="color:#F96318">Back to the arcade →</a></p>';
  } else {
    var frame = document.createElement("iframe");
    frame.className = "play-frame";
    frame.title = game.title;
    frame.allow = "autoplay; fullscreen; gamepad";
    frame.setAttribute("allowfullscreen", "");

    if (game.embed.type === "itch") {
      frame.src = "https://itch.io/embed-upload/" + encodeURIComponent(game.embed.id) + "?color=2D5D2E";
    } else if (game.embed.type === "iframe") {
      // Embeds a page that's deployed and hosted elsewhere (its own repo's
      // GitHub Pages, etc.) — the canonical build lives there, not here.
      frame.src = game.embed.url;
    } else {
      frame.src = game.embed.path;
    }
    mount.appendChild(frame);
  }

  // Ko-Fi callout under the game — always shown for a playable game, with
  // the game's own price/support line pulled from content.js so it stays
  // accurate per-game (e.g. "Free — donations welcome" vs a paid title).
  var support = document.getElementById("play-support");
  var note = document.getElementById("play-support-note");
  if (support && game.embed.type !== "external") {
    note.textContent = game.price
      ? "This game is " + game.price.charAt(0).toLowerCase() + game.price.slice(1) + "."
      : "Enjoying this? Consider supporting the studio.";
    support.hidden = false;
  }

  // Bug report / feedback widget — same gating as the Ko-Fi callout above
  // (no point offering it on the "not out yet" / external-store state, since
  // there's no actual playable build on this page to react to). GAME_NAME
  // comes straight from content.js, so nothing here needs per-game editing.
  if (game.embed.type !== "external") {
    var GAME_NAME = game.title;
    var MAILTO_BASE = "mailto:pickle.castle.studios@gmail.com";
    var lastFocused = null;

    function pcEsc(s) {
      return (s || "").replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; });
    }
    function pcVal(id) {
      var el = document.getElementById(id);
      return el ? el.value.trim() : "";
    }
    function pcContext() {
      return {
        game: GAME_NAME,
        url: location.href,
        time: new Date().toString(),
        device: navigator.userAgent,
        viewport: innerWidth + "×" + innerHeight
      };
    }
    function onModalKeydown(e) {
      if (e.key === "Escape") closeModal();
    }
    function closeModal() {
      var ov = document.getElementById("pcOverlay");
      if (ov) ov.remove();
      document.removeEventListener("keydown", onModalKeydown);
      if (lastFocused && lastFocused.focus) lastFocused.focus();
    }
    // Renders a modal from an html string and wires every [data-a] element's
    // click to `wire(action)` — the same small dispatch pattern the studio's
    // own in-game feedback panel (no-civ-just-deer-prototype) already uses.
    function openModal(html, wire) {
      closeModal();
      lastFocused = document.activeElement;
      var overlay = document.createElement("div");
      overlay.className = "pc-overlay";
      overlay.id = "pcOverlay";
      overlay.innerHTML = '<div class="pc-modal" role="dialog" aria-modal="true">' + html + '</div>';
      overlay.addEventListener("mousedown", function (e) {
        if (e.target === overlay) closeModal();
      });
      document.body.appendChild(overlay);
      document.addEventListener("keydown", onModalKeydown);
      overlay.querySelectorAll("[data-a]").forEach(function (b) {
        b.addEventListener("click", function () { wire(b.dataset.a); });
      });
      var firstField = overlay.querySelector("textarea, select, input");
      if (firstField) firstField.focus();
    }
    function showReport(title, txt, subject) {
      openModal(
        '<h3>' + pcEsc(title) + '</h3>' +
        '<p class="pc-sub">Send it to the studio (opens your mail app) — or copy it if that doesn’t work.</p>' +
        '<textarea class="pc-fld pc-report-out" id="pcReportOut" readonly>' + pcEsc(txt) + '</textarea>' +
        '<button class="pc-btn pc-btn-primary" data-a="email">📧 Send Email</button>' +
        '<button class="pc-btn pc-btn-secondary" data-a="copy">📋 Copy to Clipboard</button>' +
        '<button class="pc-btn" data-a="close">Done</button>',
        function (a) {
          if (a === "close") return closeModal();
          if (a === "email") {
            window.location.href = MAILTO_BASE + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(txt);
            var btn = document.querySelector('#pcOverlay [data-a="email"]');
            if (btn) btn.textContent = "✓ Opening your mail app…";
          }
          if (a === "copy") {
            var ta = document.getElementById("pcReportOut");
            var ok = false;
            try { ta.focus(); ta.select(); } catch (e) {}
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt);
                ok = true;
              } else {
                ok = document.execCommand("copy");
              }
            } catch (e) {}
            var btn = document.querySelector('#pcOverlay [data-a="copy"]');
            if (btn) btn.textContent = ok ? "✓ Copied" : "Select the text above and copy it";
          }
        }
      );
    }
    function openBugForm() {
      openModal(
        '<h3><img src="assets/icons/icon-report-bug.png" alt=""> Report a Bug</h3>' +
        '<p class="pc-sub">What went wrong in ' + pcEsc(GAME_NAME) + '? This builds an email you can send or copy.</p>' +
        '<label class="pc-fld-label">What went wrong?</label>' +
        '<textarea class="pc-fld" id="pcF1" placeholder="Describe the bug…"></textarea>' +
        '<label class="pc-fld-label">What were you doing when it happened?</label>' +
        '<textarea class="pc-fld" id="pcF2" placeholder="The steps that led to it…"></textarea>' +
        '<label class="pc-fld-label">Severity</label>' +
        '<select class="pc-fld" id="pcF3"><option>Minor</option><option>Annoying</option><option>Major</option><option>Game-breaking</option></select>' +
        '<button class="pc-btn pc-btn-primary" data-a="submit">Create report</button>' +
        '<button class="pc-btn" data-a="close">Cancel</button>',
        function (a) {
          if (a === "close") return closeModal();
          if (a === "submit") {
            var c = pcContext();
            var txt = "=== " + c.game + " — BUG REPORT ===\n" +
              "Page: " + c.url + "\n" +
              "Time: " + c.time + "\n" +
              "Device: " + c.device + "   ·   viewport " + c.viewport + "\n\n" +
              "WHAT WENT WRONG:\n" + (pcVal("pcF1") || "(blank)") + "\n\n" +
              "WHAT I WAS DOING:\n" + (pcVal("pcF2") || "(blank)") + "\n\n" +
              "Severity: " + pcVal("pcF3") + "\n";
            showReport("Bug report ready", txt, "[" + c.game + "] Bug Report");
          }
        }
      );
    }
    function openFeedbackForm() {
      openModal(
        '<h3><img src="assets/icons/icon-feedback.png" alt=""> Give Feedback</h3>' +
        '<p class="pc-sub">Share an idea for ' + pcEsc(GAME_NAME) + '. This builds an email you can send or copy.</p>' +
        '<label class="pc-fld-label">Your idea or feedback</label>' +
        '<textarea class="pc-fld" id="pcF1" placeholder="What would make it better?"></textarea>' +
        '<label class="pc-fld-label">Category</label>' +
        '<select class="pc-fld" id="pcF2"><option>Feature idea</option><option>Balance / difficulty</option><option>Art / visuals</option><option>UI / controls</option><option>Other</option></select>' +
        '<label class="pc-fld-label">How important is it to you?</label>' +
        '<select class="pc-fld" id="pcF3"><option>Nice to have</option><option>Would really like it</option><option>Important</option></select>' +
        '<button class="pc-btn pc-btn-secondary" data-a="submit">Create feedback</button>' +
        '<button class="pc-btn" data-a="close">Cancel</button>',
        function (a) {
          if (a === "close") return closeModal();
          if (a === "submit") {
            var c = pcContext();
            var txt = "=== " + c.game + " — FEEDBACK ===\n" +
              "Page: " + c.url + "\n" +
              "Time: " + c.time + "\n\n" +
              "IDEA / FEEDBACK:\n" + (pcVal("pcF1") || "(blank)") + "\n\n" +
              "Category: " + pcVal("pcF2") + "\n" +
              "Priority: " + pcVal("pcF3") + "\n";
            showReport("Feedback ready", txt, "[" + c.game + "] Feedback");
          }
        }
      );
    }

    var fabMenu = document.createElement("div");
    fabMenu.className = "pc-fab-menu";
    fabMenu.id = "pcFabMenu";
    fabMenu.innerHTML =
      '<button class="pc-fab-item" id="pcBugFab">' +
        '<img src="assets/icons/icon-report-bug.png" alt=""> Report a bug' +
      '</button>' +
      '<button class="pc-fab-item" id="pcFeedbackFab">' +
        '<img src="assets/icons/icon-feedback.png" alt=""> Give feedback' +
      '</button>';

    var fabBtn = document.createElement("button");
    fabBtn.className = "pc-fab";
    fabBtn.id = "pcFabBtn";
    fabBtn.setAttribute("aria-haspopup", "true");
    fabBtn.setAttribute("aria-expanded", "false");
    fabBtn.setAttribute("aria-label", "Report a bug or give feedback");
    fabBtn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none">' +
        '<circle cx="12" cy="13" r="7.5" fill="#FDF2E2" stroke="#262926" stroke-width="1.4"/>' +
        '<path d="M6 9 Q4 5 7 4" stroke="#262926" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
        '<path d="M18 9 Q20 5 17 4" stroke="#262926" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
        '<circle cx="9.3" cy="12" r="1.15" fill="#262926"/>' +
        '<circle cx="14.7" cy="12" r="1.15" fill="#262926"/>' +
        '<path d="M10 16.3 Q12 17.6 14 16.3" stroke="#262926" stroke-width="1.3" fill="none" stroke-linecap="round"/>' +
      '</svg>';

    document.body.appendChild(fabMenu);
    document.body.appendChild(fabBtn);

    fabBtn.addEventListener("click", function () {
      var open = fabMenu.classList.toggle("open");
      fabBtn.setAttribute("aria-expanded", open);
    });
    document.getElementById("pcBugFab").addEventListener("click", function () {
      fabMenu.classList.remove("open");
      fabBtn.setAttribute("aria-expanded", "false");
      openBugForm();
    });
    document.getElementById("pcFeedbackFab").addEventListener("click", function () {
      fabMenu.classList.remove("open");
      fabBtn.setAttribute("aria-expanded", "false");
      openFeedbackForm();
    });
  }
})();
</script>
</body>
</html>
