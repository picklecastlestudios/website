name: Receive Game Release

on:
  repository_dispatch:
    types: [game-release]

# Explicitly allow the workflow to commit and push changes back to the repo
permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release File
        run: |
          mkdir -p content/releases
          filename="content/releases/${{ github.event.client_payload.game }}-${{ github.event.client_payload.version }}.md"
          
          # Write Markdown Frontmatter (Metadata) followed by the release body
          echo "---" > "$filename"
          echo "game: '${{ github.event.client_payload.game }}'" >> "$filename"
          echo "version: '${{ github.event.client_payload.version }}'" >> "$filename"
          echo "---" >> "$filename"
          echo "" >> "$filename"
          echo "${{ github.event.client_payload.body }}" >> "$filename"

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/releases/
          
          # Only commit if there are actual file changes detected
          if ! git diff --staged --quiet; then
            git commit -m "Chore: Add release notes for ${{ github.event.client_payload.game }} ${{ github.event.client_payload.version }}"
            git pull --rebase
            git push
          else
            echo "No changes detected, skipping commit."
          fi
