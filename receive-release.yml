name: Receive Game Release

on:
  repository_dispatch:
    types: [game-release]

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release File
        run: |
          mkdir -p content/releases
          echo "${{ github.event.client_payload.body }}" > "content/releases/${{ github.event.client_payload.game }}-${{ github.event.client_payload.version }}.md"

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Chore: Add release notes for ${{ github.event.client_payload.game }} ${{ github.event.client_payload.version }}"
          git push
